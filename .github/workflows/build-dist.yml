name: Build dist (fork)

on:
    push:
        branches: [sdk-v165]
    workflow_dispatch:

env:
    DEBUG: 'napi:*'
    MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
    build:
        runs-on: ubuntu-latest

        # Run in ubuntu:20.04 container to avoid the issue with glibc version
        container:
            image: ubuntu:20.04

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            # ubuntu:20.04 does not have curl and gcc/g++ installed by default
            - run: apt-get update && apt-get install -y curl build-essential

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  targets: x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu

            - uses: Swatinem/rust-cache@v2

            - run: cargo install cargo-xwin

            - name: Node install
              run: npm ci

            - name: Build Linux
              run: npm run build -- --target x86_64-unknown-linux-gnu

            - name: Build Windows
              run: npm run build -- --target x86_64-pc-windows-msvc

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: binaries-windows-linux
                  path: dist
                  if-no-files-found: error

    build-mac:
        runs-on: macos-latest

        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: stable
                  targets: x86_64-apple-darwin, aarch64-apple-darwin

            - uses: Swatinem/rust-cache@v2

            - name: Node install
              run: npm ci

            - name: Build Mac x64
              run: npm run build -- --target x86_64-apple-darwin

            - name: Build Mac arm64
              run: npm run build -- --target aarch64-apple-darwin

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: binaries-macos
                  path: dist
                  if-no-files-found: error

    commit-dist:
        runs-on: ubuntu-latest
        needs: [build, build-mac]
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v4
              with:
                  ref: sdk-v165

            - name: Download build
              uses: actions/download-artifact@v4
              with:
                  path: dist/
                  pattern: binaries-*
                  merge-multiple: true

            - name: Log files
              run: |
                  echo "- Root directory:" && ls
                  echo "- Dist directory:" && ls -R dist

            - name: Commit dist to sdk-v165-built branch
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git checkout -B sdk-v165-built
                  git add -f dist
                  git commit -m "Prebuilt dist for sdk-v165 ($(date -u +%Y-%m-%dT%H:%M:%SZ))" || echo "nothing to commit"
                  git push -f origin sdk-v165-built
